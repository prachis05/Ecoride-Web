
name: EcoRide CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run automated tests
        working-directory: backend
        run: npm test

      - name: Build backend Docker image
        run: docker build -t ecoride-backend:ci ./backend

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/devops-setup'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/devops-setup'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/devops-setup'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ecoride-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag ecoride-backend:ci "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Configure SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/devops-setup'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ vars.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        if: github.event_name == 'push' && github.ref == 'refs/heads/devops-setup'
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          set -eu
          ssh -i ~/.ssh/ec2_key \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" \
            "echo SSH_CONNECTION_OK"

      - name: Deploy to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/devops-setup'
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ecoride-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu

          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin $ECR_REGISTRY && sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "sudo docker inspect ecoride-backend --format='{{.Config.Image}}' > /tmp/ecoride-previous-image && sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "sudo docker stop ecoride-backend && sudo docker rm ecoride-backend && sudo docker run -d --name ecoride-backend --restart unless-stopped -p 5000:5000 --env-file /home/ubuntu/ecoride.env $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "sleep 5 && curl -fsS http://localhost:5000/health"
