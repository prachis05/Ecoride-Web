
name: EcoRide CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run automated tests
        working-directory: backend
        run: npm test

      - name: Build backend Docker image
        run: docker build -t ecoride-backend:ci ./backend

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/devops-setup'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/devops-setup'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/devops-setup'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ecoride-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag ecoride-backend:ci "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  deploy-to-ec2:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/devops-setup'
    runs-on: self-hosted

    steps:
      - name: Deploy container on EC2
        env:
          ECR_REGISTRY: 322768320060.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: ecoride-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu

          echo "Logging in to Amazon ECR..."
          aws ecr get-login-password --region ap-south-1 \
            | sudo docker login --username AWS --password-stdin "$ECR_REGISTRY"

          echo "Pulling new image..."
          sudo docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Replacing the running container..."
          sudo docker rm -f ecoride-backend || true
          sudo docker run -d \
            --name ecoride-backend \
            --restart unless-stopped \
            -p 5000:5000 \
            --env-file /home/ubuntu/ecoride.env \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Waiting for health check..."
          sleep 5
          curl -fsS http://localhost:5000/health
